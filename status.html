<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>Acompanhe seu aparelho</title>
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: #1d4ed8; color: #fff; padding: 18px 16px; text-align: center; }
    header h1 { margin: 0; font-size: 20px; } header div { opacity: .85; font-size: 14px; margin-top: 2px; }
    main { max-width: 520px; margin: 0 auto; padding: 14px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .num { color: #1d4ed8; font-weight: 800; } .ap { font-size: 18px; font-weight: 700; margin: 4px 0; }
    .muted { color: #6b7280; font-size: 14px; }
    .passos { list-style: none; padding: 0; margin: 0; }
    .passos li { display: flex; gap: 12px; align-items: center; padding: 8px 0; color: #9ca3af; }
    .passos li .b { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #d1d5db; display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; background: #fff; }
    .passos li.feito { color: #111827; } .passos li.feito .b { background: #16a34a; border-color: #16a34a; color: #fff; }
    .passos li.atual { color: #1d4ed8; font-weight: 700; } .passos li.atual .b { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .orc { margin-top: 12px; padding: 14px; border-radius: 12px; background: #fef9c3; border: 1px solid #fde047; }
    .orc-t { font-weight: 700; margin-bottom: 6px; }
    .orc-v { font-size: 26px; font-weight: 800; margin: 8px 0; color: #713f12; }
    .orc-b { display: flex; gap: 8px; margin: 10px 0 6px; }
    .orc-b button { flex: 1; padding: 13px; border-radius: 10px; font-size: 16px; font-weight: 700; border: 0; cursor: pointer; }
    .b-ok { background: #16a34a; color: #fff; } .b-no { background: #fff; color: #374151; border: 1px solid #d1d5db !important; }
    .orc-b button:disabled { opacity: .6; }
    .destaque { padding: 12px; border-radius: 10px; font-weight: 600; margin-top: 10px; }
    .verde { background: #dcfce7; color: #166534; } .amarelo { background: #fef3c7; color: #92400e; } .vermelho { background: #fee2e2; color: #991b1b; }
    a.btn { display: block; text-align: center; background: #25d366; color: #fff; padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; font-size: 16px; }
    .center { text-align: center; padding: 40px 10px; }
  </style>
</head>
<body>
  <header><h1 id="loja">Acompanhe seu aparelho</h1><div id="lojaEnd"></div></header>
  <main id="conteudo"><div class="center muted">Carregando…</div></main>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="status.js"></script>
</body>
</html>
